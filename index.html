<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HATTARI</title>
    <style>
      /* 本体の CSS は JS 経由で読み込まれるため、適用前の素の HTML が一瞬見えてしまう。
         背景の黒と「準備ができるまで隠す」指定だけはここで先に効かせておく */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body:not(.ready) > * {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="rain"></canvas>
    <div id="stage">
      <header id="hud">
        <div class="brand">HATTARI<span>//construct shell</span></div>
        <div id="pipeline"></div>
        <div class="right">
          <button id="modebtn" type="button" aria-label="switch mode">FREE</button>
          <div id="mode">AUTO</div>
          <div id="signal" title="typing intensity"></div>
          <div id="clock"></div>
          <button id="theme" type="button" aria-label="switch theme">MATRIX</button>
          <button id="mute" type="button" aria-label="toggle sound">SND ON</button>
        </div>
      </header>
      <div id="main">
        <main id="term" aria-live="off"></main>
        <aside id="side"></aside>
      </div>
      <footer id="foot">
        <span id="target"></span>
        <span class="tip"><span id="audiohint">CLICK OR TYPE TO ENABLE AUDIO · </span>TYPE ANYTHING · ⏎ EXECUTE · ESC AUTOPILOT</span>
      </footer>
    </div>
    <canvas id="shatter"></canvas>
    <div id="letterbox"><div class="lb top"></div><div class="lb bottom"><div id="subtitle"></div></div></div>
    <div id="fx"></div>
    <div id="crt"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
